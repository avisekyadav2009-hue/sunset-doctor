name: Bug report
description: Report a false positive, false negative, or scanner issue
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never include secrets, API keys, credentials, private code, or customer data.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal sanitized reproduction
      description: Use a small synthetic example instead of private production code.
