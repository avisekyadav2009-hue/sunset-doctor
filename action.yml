name: SunsetDoctor
description: Scan a repository for OpenAI deprecations and shutdown deadlines
inputs:
  path:
    description: Path to scan
    required: false
    default: .
  fail-on:
    description: Failure threshold (critical, high, medium, low, any, overdue, never)
    required: false
    default: critical
  report:
    description: Optional HTML report path
    required: false
    default: sunset-doctor-report.html
outputs:
  findings:
    description: Number of remaining deprecation findings
  fixes:
    description: Number of safe automatic fixes identified/applied by the CLI
  report:
    description: Generated HTML report path
runs:
  using: node24
  main: src/index.js
branding:
  icon: alert-triangle
  color: orange
